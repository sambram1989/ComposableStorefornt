<div class="sidebar">
  <div class="filter-container">
      <div class="filter-header">
        <h3><svg width="13" height="20" viewBox="0 0 13 20" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M0 5.375C0 4.91016 0.382812 4.5 0.875 4.5H11.375C11.8398 4.5 12.25 4.91016 12.25 5.375C12.25 5.86719 11.8398 6.25 11.375 6.25H0.875C0.382812 6.25 0 5.86719 0 5.375ZM1.75 9.75C1.75 9.28516 2.13281 8.875 2.625 8.875H9.625C10.0898 8.875 10.5 9.28516 10.5 9.75C10.5 10.2422 10.0898 10.625 9.625 10.625H2.625C2.13281 10.625 1.75 10.2422 1.75 9.75ZM7.875 14.125C7.875 14.6172 7.46484 15 7 15H5.25C4.75781 15 4.375 14.6172 4.375 14.125C4.375 13.6602 4.75781 13.25 5.25 13.25H7C7.46484 13.25 7.875 13.6602 7.875 14.125Z" fill="#101828"/>
          </svg>
          Filters</h3>
        <button *ngIf="showResetOption" (click)="resetFilters()">Reset filters</button>
      </div>

      <div *ngFor = " let filter of facetFilters;trackBy: trackById" class="filter-section">
          <button class="filter-toggle" (click)="filter.visible = !filter.visible">
            Filter by {{ filter.name }}
            <i class="fa float-right" [ngClass]="filter.visible ? 'fa-chevron-up': 'fa-chevron-down'"></i>
          </button>
          <div *ngIf="filter.visible && showSearchFacets(filter.values)" role="presentation" class="search-icon">
              <input  type="text" placeholder="Search {{filter?.name}}" aria-label="Search filters" [maxLength]="100" [value]="searchValues[filter?.name] || ''" (input)="searchFilters(filter, $event)">
              <cx-icon [type]="iconTypes.SEARCH"></cx-icon>
          </div>
          <div *ngIf="filter.visible && filter.values.length > 0" class="filter-options">
            <div *ngFor = " let option of filter.values">
            <label *ngIf ="option.name && option.name !== 'Full Catalog'"><input (change)="setFilter(option)" type="checkbox" [(ngModel)]="option.selected" [value] = "option.selected"> {{ option.name }}</label>
            </div>
          </div>
          <div *ngIf="filter.values.length === 0" class="text-center mt-2">
            <div class="no-results-wrapper">
              <div class="no-results-card">
                <h6 class="fs-14 bolder">No results found</h6>
                <p class="fs-12 mt-3">We couldn't find any matches for {{searchedText}}.<br>
                  Please try searching with another term.</p>
              </div>
            </div>
        </div>
        </div>
    </div>
  </div>

            <div class="action-buttons col-12">
              <button class="filter-btn col-12" (click)="openMobileFilters()">
                <svg width="13" height="20" viewBox="0 0 13 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M0 5.375C0 4.91016 0.382812 4.5 0.875 4.5H11.375C11.8398 4.5 12.25 4.91016 12.25 5.375C12.25 5.86719 11.8398 6.25 11.375 6.25H0.875C0.382812 6.25 0 5.86719 0 5.375ZM1.75 9.75C1.75 9.28516 2.13281 8.875 2.625 8.875H9.625C10.0898 8.875 10.5 9.28516 10.5 9.75C10.5 10.2422 10.0898 10.625 9.625 10.625H2.625C2.13281 10.625 1.75 10.2422 1.75 9.75ZM7.875 14.125C7.875 14.6172 7.46484 15 7 15H5.25C4.75781 15 4.375 14.6172 4.375 14.125C4.375 13.6602 4.75781 13.25 5.25 13.25H7C7.46484 13.25 7.875 13.6602 7.875 14.125Z" fill="#101828"/>
                  </svg>
                  Filters({{selectedMobileFilter?.length}})
              </button>
          </div>

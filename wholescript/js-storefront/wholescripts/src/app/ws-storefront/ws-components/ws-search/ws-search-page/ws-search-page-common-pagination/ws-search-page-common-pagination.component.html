<div class="products-search-pagination">
    <div class="products-search-showing-count">
      Showing <span>{{ currentPage + 1 }} to {{ totalPageCount }}</span>
    </div>
    <div class="text-right mt-3 search-pagination-wrapper">
      <div class="float-right">
        <nav>
          <ul class="pagination pull-right">
            <!-- Previous Button -->
            <li class="page-item">
              <button
                class="page-link previous-link"
                aria-label="Previous"
                [disabled]="currentPage === 0"
                (click)="updatePage(currentPage - 1)"
              >
                <span aria-hidden="true"><i class="fa fa-chevron-left"></i></span>
                <span class="sr-only">Previous</span>
              </button>
            </li>
  
            <!-- First Page -->
            <li class="page-item">
              <button
                class="page-link"
                type="button"
                [ngClass]="currentPage === 0 && 'active'"
                (click)="updatePage(0)"
              >
                1
              </button>
            </li>
  
            <!-- Left Ellipsis -->
            <li class="page-item" *ngIf="currentPage > 4">
              <button class="page-link" type="button" disabled>
                ...
              </button>
            </li>
  
            <!-- Dynamic Page Numbers -->
            <ng-container *ngFor="let page of getVisiblePages(); let i = index">
              <li class="page-item">
                <button
                  class="page-link"
                  type="button"
                  [ngClass]="currentPage === page && 'active'"
                  (click)="updatePage(page)"
                >
                  {{ page + 1 }}
                </button>
              </li>
            </ng-container>
  
            <!-- Right Ellipsis -->
            <li class="page-item" *ngIf="currentPage < totalPageCount - 5">
              <button class="page-link" type="button" disabled>
                ...
              </button>
            </li>
  
            <!-- Last Page -->
            <li class="page-item lastpage" *ngIf="totalPageCount > 1">
              <button
                class="page-link"
                type="button"
                [ngClass]="currentPage === totalPageCount - 1 && 'active'"
                (click)="updatePage(totalPageCount - 1)"
              >
                {{ totalPageCount }}
              </button>
            </li>
  
            <!-- Next Button -->
            <li class="page-item">
              <button
                class="page-link next-link"
                aria-label="Next"
                (click)="updatePage(currentPage + 1)"
                [disabled]="totalPageCount === currentPage + 1"
              >
                <span aria-hidden="true"><i class="fa fa-chevron-right"></i></span>
                <span class="sr-only">Next</span>
              </button>
            </li>
          </ul>
        </nav>
      </div>
    </div>
  </div>

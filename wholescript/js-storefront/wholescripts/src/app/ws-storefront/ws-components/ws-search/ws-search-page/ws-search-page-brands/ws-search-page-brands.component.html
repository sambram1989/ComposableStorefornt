<div class="search-page-brands" *ngIf="searchData?.results?.length > 0">
    <ws-search-page-common-heading [heading]="'Brands'" [totalResultsCount]="searchData?.pagination?.totalResults || 0"
        [viewAllFlag]="viewAllFlag" (showNumberOfResults)="showNumberOfResults($event)"
        (viewAll)="viewAllEmit()"></ws-search-page-common-heading>
    <div class="search-brands-wrapper">
        <ng-container *ngFor="let brand of searchData.results">
            <div class="search-each-brand" (click)="navigateTo(brand?.brandURL)" tabindex="0" (keydown.enter)="navigateTo(brand?.brandURL)">
                <div class="brand-image">
                    <img [src]="getImage(brand)" width="272" height="100" [alt]="'Brand Logo'"/>
                </div>
            </div>
        </ng-container>
    </div>
    <hr>
    <ws-search-page-common-pagination [currentPage]="currentPage" *ngIf="searchData?.pagination?.totalPages > 1"
        [totalPageCount]="searchData?.pagination?.totalPages || 0"
        (setCurrentPage)="setCurrentPage($event)"></ws-search-page-common-pagination>
    <!-- <div class="d-flex justify-content-between">
        <div>
            Showing <span>{{ currentPage ? currentPage : 1 }} of {{ searchData?.pagination?.totalPages }}</span>
        </div>
        <div *ngIf="searchData?.pagination?.totalPages > 1">
            <ws-pagination (currentPageChange)="setCurrentPage($event)" [itemsPerPage]="pageSize" [totalItems]="searchData?.pagination?.totalResults || 0"
            [numberOfPagesNeedTOBeShown]="5" aria-label="Pagination controls"></ws-pagination>
        </div>
    </div> -->
</div>
<div class="table-empty" *ngIf="searchData?.results?.length == 0 && viewAllFlag">
   <div>
      <h4 class="table-empty__h">No results found</h4>
      <div>We couldn't find any matches for <span style="font-weight:900">{{searchTerm}}</span></div>
      <div>Please try reducing your filters or searching with another term</div>
   </div>
</div>

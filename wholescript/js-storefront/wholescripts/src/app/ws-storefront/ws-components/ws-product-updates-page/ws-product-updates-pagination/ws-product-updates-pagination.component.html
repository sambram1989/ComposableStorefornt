<div class="text-right mt-3" id="product-updates-pagination-wrapper">
    <div class="float-right">
        <nav>
            <ul class="pagination pull-right">
                <li class="page-item"><button class="page-link" aria-label="Previous" [disabled]="currentPage === 0" (click)="updatePage(currentPage - 1)"><span
                            aria-hidden="true"><i class="fa fa-chevron-left"></i></span><span
                            class="sr-only">Previous</span></button></li>
                <li class="page-item"
                    *ngFor='let in of counter(totalPageCount) ;let i = index' (click)="updatePage(i)">
                    <button class="page-link" type="button" [ngStyle]="{'font-weight': currentPage === i ? 'bolder' : 'normal' }">{{i + 1}}</button>
                </li>
                <li class="page-item"><button class="page-link" aria-label="Previous" (click)="updatePage(currentPage + 1)" [disabled]="totalPageCount === currentPage + 1"><span aria-hidden="true"><i
                                class="fa fa-chevron-right"></i></span><span class="sr-only">Next</span></button></li>
            </ul>
        </nav>
    </div>
</div>

<div [ngClass]="isActive() ? 'isActive' : 'notActive'" class="parent " (click)="isActive.set(true)">
    <div class="d-flex justify-content-between fs-18 ">
        <div class="content p-3">
            <p>{{existingAddress()?.addressDescription}} | {{existingAddress()?.firstName}} {{existingAddress()?.lastName}} </p>
            <p>{{existingAddress()?.formattedAddress}}</p>
        </div>
        <div class="state">
            @if(isActive()){
                <div class="bg-set px-4">
                    <i class="fas fa-check set-state"></i>
                </div>
            }
            @else {
                <div class="bg-circle px-4">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-circle" viewBox="0 0 16 16">
                        <path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14m0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16"/>
                      </svg>
                </div>
            }
        </div>
    </div>
</div>

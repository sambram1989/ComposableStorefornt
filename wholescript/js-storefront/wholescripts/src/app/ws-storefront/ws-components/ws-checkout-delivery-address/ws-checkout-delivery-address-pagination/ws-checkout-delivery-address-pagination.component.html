<div class="checkout-delivery-address-pagination">
    <div class="checkout-delivery-address-showing-count">
        Showing <span>{{currentPage + 1}} to {{totalPageCount}}</span>
    </div>
    <div class="text-right mt-3 delivery-address-pagination-wrapper">
        <div class="float-right">
            <nav>
                <ul class="pagination pull-right">
                    <li class="page-item">
                        <button class="page-link previous-link" aria-label="Previous" [disabled]="currentPage === 0"
                            (click)="updatePage(currentPage - 1)">
                            <span aria-hidden="true"><i class="fa fa-chevron-left"></i></span>
                            <span class="sr-only">Previous</span>
                        </button>
                    </li>
                    <ng-template ngFor let-in [ngForOf]="counter(totalPageCount)" let-i="index">
                        <li class="page-item" (click)="updatePage(i)">
                            <button class="page-link" type="button" [ngClass]="currentPage === i && 'active'">
                                {{i + 1}}
                            </button>
                        </li>
                    </ng-template>
                    <li class="page-item">
                        <button class="page-link next-link" aria-label="Previous" (click)="updatePage(currentPage + 1)"
                            [disabled]="totalPageCount === currentPage + 1">
                            <span aria-hidden="true"><i class="fa fa-chevron-right"></i></span>
                            <span class="sr-only">Next</span>
                        </button>
                    </li>
                </ul>
            </nav>
        </div>
    </div>
</div>

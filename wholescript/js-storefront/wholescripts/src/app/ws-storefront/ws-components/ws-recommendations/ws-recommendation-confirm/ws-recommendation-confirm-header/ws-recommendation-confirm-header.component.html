<div class="rec-sucessfull-sec">
  <div class="row justify-content-center">
    <div class="col-12 success-container pb-4">
      <div
        class="success-icon-sec d-flex align-items-center justify-content-center flex-column"
      >
        <img src="/assets/images/recomendation/check_circle.svg" alt="success icon" />
        <h2>Success!</h2>
      </div>
      <div class="rec-id">Recommendation #{{recommendationId}}</div>
      <p>
        Your recommendation has been sent to 1 patient(s) and they will be
        alerted via the selected communication method.
      </p><br/>
      <a tabindex="0" role="button" class="btn-link pb-4" (keypress) = "goToRecommendations()" (click) = "goToRecommendations()"><b>Click here to go back to Recommendations</b></a>
    </div>
  </div>
</div>

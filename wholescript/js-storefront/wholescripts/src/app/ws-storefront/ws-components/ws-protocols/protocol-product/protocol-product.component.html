<div class="modal-content p-3 unset-style" role="dialog" aria-label="modal-title"
    aria-details="modal-description"> 
    <div class="modal-body p-0">
        <section>
            <div class="row">
                <div class="col-2">
                    <img alt="HistDAO™ 60 Capsules" class="product-image" width="100%"
                        src="https://qa.wholescripts.com/images/thumbs/0004889_histdao-60-capsules_200.png">
                </div>
                <div class="col">
                    <span class="bolder product-name">{{product()?.product?.name}}</span>
                    <p class="mt-2 mb-0">
                        Dosing: 1 in AM | 1 in PM
                    </p>
                    <p>
                        Duration: {{product()?.itemDuration}}, 1 Unit(s)
                    </p>
                    <p class="mt-2 mb-0 fw-900">
                        {{product()?.basePrice?.formattedValue}}
                    </p>
                    <p class="">
                        MSRP: {{product()?.basePrice?.formattedValue}}
                    </p>
                </div>
            </div>
        </section>
    </div>
</div>

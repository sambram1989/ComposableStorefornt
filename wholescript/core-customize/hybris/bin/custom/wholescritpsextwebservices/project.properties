# you can put key/value pairs here.
# Use Config.getParameter(..) to retrieve the values during runtime.

# Specifies the location of the spring context file putted automatically to the global platform application context.
wholescritpsextwebservices.application-context=wholescritpsextwebservices-spring.xml

wholescritpsextwebservices.api.title=Wholescripts External webservices
wholescritpsextwebservices.api.description=Wholescripts External webservices API Documentation
wholescritpsextwebservices.api.version=1.0.0
wholescritpsextwebservices.api.license=Use of this file is subject to the terms of your agreement with Wholescripts SE or its affiliates respecting the use of the Wholescripts product for which this file relates.
wholescritpsextwebservices.api.license.url=
wholescritpsextwebservices.api.oauth.tokenUrl=/authorizationserver/oauth/token
wholescritpsextwebservices.api.oauth.password.scope=basic
wholescritpsextwebservices.api.oauth.clientCredentials.scope=extended

wholescritpsextwebservices.sap.apiType=REST
wholescritpsextwebservices.sap.shortText=wholescritpsextwebservices
wholescritpsextwebservices.sap.state=Active
wholescritpsextwebservices.sap.servers=default
wholescritpsextwebservices.sap.server.default.url=https://{url}/external/API
wholescritpsextwebservices.sap.server.default.description=wholescritpsextwebservices REST API endpoint
wholescritpsextwebservices.sap.server.default.templates.url.description=SAP Commerce Cloud server URL where the application is deployed.

#enables static documentation generation by wsStaticDoc ant task
wholescritpsextwebservices.documentation.static.generate=true
#ext.wholescritpsextwebservices.extension.webmodule.webroot=/wholescritpsextwebservices

#Disabling tld and pluggability scans can greatly improve system startup time.
#wholescritpsextwebservices.tomcat.tld.scan=*jstl-1*.jar
#wholescritpsextwebservices.tomcat.tld.default.scan.enabled=false
#wholescritpsextwebservices.tomcat.pluggability.scan=*jstl-1*.jar
#wholescritpsextwebservices.tomcat.pluggability.default.scan.enabled=false

